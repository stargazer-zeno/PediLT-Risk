name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/risk-prediction-system/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/risk-prediction-system/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/risk-prediction-system/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/risk-prediction-system/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  research-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install numpy pandas scipy scikit-learn matplotlib
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall llm machine_learning evaluation tests

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate Compose configuration
        working-directory: apps/risk-prediction-system
        run: docker compose -f compose.yaml config
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: apps/risk-prediction-system
          file: apps/risk-prediction-system/backend/Dockerfile
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: apps/risk-prediction-system/frontend
          file: apps/risk-prediction-system/frontend/Dockerfile
          push: false

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
